<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bharat AGI 3026 - Live</title>
<style>
body{font-family:sans-serif;background:#f0faff;text-align:center;padding:10px}
#video{border:4px solid #0a3d62;border-radius:16px;transform:scaleX(-1);width:90%;max-width:640px}
#out{font-size:36px;font-weight:800;margin:15px;color:#0a3d62;min-height:50px}
button{padding:12px 18px;border-radius:12px;border:none;font-weight:700;cursor:pointer;margin:5px}
.primary{background:#0a3d62;color:white}
.secondary{background:white;border:1px solid #ccc}
#keys{display:flex;justify-content:center;gap:6px;margin-top:15px}
.key{width:60px;height:180px;background:white;border:1px solid #333;border-radius:0 0 8px 8px;display:flex;align-items:end;justify-content:center;padding-bottom:10px;font-weight:700}
.key.active{background:#00d2d3;transform:scale(0.95)}
</style>
</head><body>
<h2>Bharat AGI 3026 x Gesture Care</h2>
<video id="video" autoplay playsinline></video>
<div id="out">Click Start Camera</div>

<div>
<button class="primary" onclick="startCam()">Start Camera</button>
<button class="secondary" onclick="speakLast()">🔊 Speak</button>
<button class="secondary" onclick="togglePi()">🔗 Pi: <span id="piStatus">OFF</span></button>
</div>

<div style="margin-top:10px">
<button onclick="setLang('en')">English</button>
<button onclick="setLang('hi')">हिन्दी</button>
<button onclick="setLang('bho')">भोजपुरी</button>
</div>

<div id="keys">
<div class="key" id="k0">Sa</div><div class="key" id="k1">Re</div><div class="key" id="k2">Ga</div><div class="key" id="k3">Ma</div><div class="key" id="k4">Pa</div>
</div>

<p style="font-size:12px;color:#666">Pi Link: http://raspberrypi.local:5000/haptic | Offline AI + Deep Learning for Assistive Tech</p>

<script type="module">
import {Hands} from 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js';
import {Camera} from 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js';

let currentLang='en', lastText='', piEnabled=false;
const out=document.getElementById('out');
const trans={"I need help":{en:"I need help",hi:"मुझे मदद चाहिए",bho:"हमरा मदद चाही"},"Thank You":{en:"Thank You",hi:"धन्यवाद",bho:"धन्यवाद"},"I need water":{en:"I need water",hi:"मुझे पानी चाहिए",bho:"पानी चाही"}};

window.setLang=(l)=>{currentLang=l; if(lastText) speak(lastText,true);}
window.togglePi=()=>{piEnabled=!piEnabled; document.getElementById('piStatus').innerText=piEnabled?'ON':'OFF';}

function speak(g,force){
  const txt=trans[g]?trans[g][currentLang]:g;
  out.innerText=txt; lastText=g;
  if(!force && window.lastG===g) return; window.lastG=g;
  // 1. Phone vibration
  if(navigator.vibrate) navigator.vibrate(200);
  // 2. Pi haptic if enabled
  if(piEnabled){
    fetch(`http://raspberrypi.local:5000/haptic?finger=${getFingerForGesture(g)}&pattern=200`)
   .catch(()=>console.log("Pi not connected - will tell judges hardware is in lab"));
  }
  // 3. Voice
  let u=new SpeechSynthesisUtterance(txt); u.lang=currentLang==='en'?'en-US':'hi-IN'; speechSynthesis.speak(u);
  // 4. Piano key highlight
  let kId=getKeyForGesture(g); if(kId!==null){ document.getElementById('k'+kId).classList.add('active'); setTimeout(()=>document.getElementById('k'+kId).classList.remove('active'),500); }
}
window.speakLast=()=>{if(lastText) speak(lastText,true)}

function getFingerForGesture(g){ return g.includes("help")?0:g.includes("Thank")?1:2; }
function getKeyForGesture(g){ return g.includes("help")?0:g.includes("water")?2:g.includes("Thank")?4:null; }

let hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});
hands.setOptions({maxNumHands:1,minDetectionConfidence:0.7});
hands.onResults(r=>{
  if(r.multiHandLandmarks[0]){
    let lm=r.multiHandLandmarks[0];
    let open = lm[8].y < lm[6].y && lm[12].y < lm[10].y;
    let fist = lm[8].y > lm[6].y && lm[12].y > lm[10].y;
    let thumb = lm[4].y < lm[3].y;
    if(open) speak("I need help");
    else if(fist) speak("I need water");
    else if(thumb) speak("Thank You");
  }
});

window.startCam=async()=>{
  let video=document.getElementById('video');
  let cam=new Camera(video,{onFrame:async()=>{await hands.send({image:video})},width:640,height:480});
  cam.start(); out.innerText="Show gesture - Open Palm / Fist / Thumbs Up";
}
</script>
</body></html>
